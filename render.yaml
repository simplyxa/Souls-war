databases:
  - name: souls-war-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: souls-war-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: souls-war-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: PORT
        value: "3000"
      - key: SEED_DEMO
        value: "true"

  - type: web
    name: souls-war-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://souls-war-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
